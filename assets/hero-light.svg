  <rect x="344" y="110" width="150" height="42" rx="3" fill="#EAE0C6" stroke="#8C7A58" stroke-width="1.2"/>
  <rect x="344" y="110" width="150" height="3" rx="1" fill="#15803D"/>
  <text x="354" y="126" class="mono" font-size="8.5" font-weight="700" fill="#594D39">ACTIVITY</text>
