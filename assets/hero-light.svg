  <text x="38" y="28" class="mono" font-size="10.5" font-weight="700" fill="#15803D" letter-spacing="0.8">SYS.ONLINE // VERIFIED TELEMETRY PROFILE</text>
  <text x="814" y="28" text-anchor="end" class="mono" font-size="10" font-weight="600" fill="#594D39">@25sarvesh2005 · SYNC 2026-11-27</text>

  <!-- Hero Display Name + Pixel Shadow -->
  <text x="26" y="72" class="sans" font-size="30" font-weight="800" fill="#8C7A58" opacity="0.55" letter-spacing="1.4">SARVESH SHARMA</text>
  <text x="24" y="70" class="sans" font-size="30" font-weight="800" fill="#201D1E" letter-spacing="1.4">SARVESH SHARMA</text>
  <text x="25" y="92" class="mono" font-size="11.5" font-weight="600" fill="#1D4ED8" letter-spacing="0.6">TELEMETRY LEAD · VERIFIABLE AI PIPELINES · DETERMINISTIC SYSTEMS</text>

