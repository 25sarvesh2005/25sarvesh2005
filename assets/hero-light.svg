      <rect class="twinkle-b" x="84" y="98" width="4" height="4" fill="#B45309"/>
      <rect class="twinkle-b" x="584" y="88" width="4" height="4" fill="#15803D"/>
      <rect class="twinkle-a" x="584" y="100" width="4" height="4" fill="#1D4ED8"/>
      <rect class="twinkle-a" x="628" y="96" width="4" height="4" fill="#B45309"/>
      <rect class="twinkle-b" x="676" y="80" width="4" height="4" fill="#1D4ED8"/>
      <rect class="twinkle-a" x="688" y="90" width="4" height="4" fill="#BE123C"/>
      <rect class="twinkle-b" x="770" y="92" width="4" height="4" fill="#15803D"/>
    </g>

    <!-- CRT Scanline Texture + Animated Laser Sweep -->
    <rect x="8" y="8" width="824" height="156" fill="url(#hero-scan-light)"/>
    <rect class="scan-beam" x="8" y="8" width="824" height="3" fill="#1D4ED8"/>
  </g>

  <!-- Corner Pixel Brackets & Rivets -->
  <g shape-rendering="crispEdges" fill="#1D4ED8">
    <rect x="4" y="4" width="14" height="3"/><rect x="4" y="4" width="3" height="14"/>
    <rect x="822" y="4" width="14" height="3"/><rect x="833" y="4" width="3" height="14"/>
    <rect x="4" y="165" width="14" height="3"/><rect x="4" y="154" width="3" height="14"/>
    <rect x="822" y="165" width="14" height="3"/><rect x="833" y="154" width="3" height="14"/>
