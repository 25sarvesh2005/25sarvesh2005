<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 172" width="840" height="172" role="img" aria-labelledby="hero-title-light hero-desc-light">
  <title id="hero-title-light">Sarvesh Sharma (@25sarvesh2005) — Cyber-Citadel Profile Banner</title>
  <desc id="hero-desc-light">Level 15 Telemetry Lead with 4389 verified XP and 1017 GitHub contributions.</desc>
  <defs>
    <linearGradient id="hero-sky-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5ECD8"/>
      <stop offset="100%" stop-color="#E3D4B2"/>
    </linearGradient>
    <radialGradient id="hero-glow-l-light" cx="18%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-glow-r-light" cx="82%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-scan-light" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#8C7A58" opacity="0.1"/>
    </pattern>
    <clipPath id="hero-stage-clip-light">
      <rect x="8" y="8" width="824" height="156" rx="3"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .blink-led { animation: led 1.6s steps(2, end) infinite; }
      .twinkle-a { animation: twinkle 2.3s steps(2, end) infinite; }
      .twinkle-b { animation: twinkle 3.1s steps(2, end) 0.9s infinite; }
      .scan-beam { animation: beam 5.5s linear infinite; }
      @keyframes led { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      @keyframes twinkle { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.22; } }
      @keyframes beam {
        0% { transform: translateY(-6px); opacity: 0; }
        12%, 88% { opacity: 0.28; }
        100% { transform: translateY(156px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Outer Pixel Cartridge Frame -->
  <rect x="2" y="2" width="836" height="168" rx="4" fill="#FAF6EA" stroke="#8C7A58" stroke-width="2"/>
  <rect x="8" y="8" width="824" height="156" rx="3" fill="url(#hero-sky-light)" stroke="#8C7A58" stroke-width="1.2"/>

  <g clip-path="url(#hero-stage-clip-light)">
    <rect x="8" y="8" width="824" height="156" fill="url(#hero-glow-l-light)"/>
    <rect x="8" y="8" width="824" height="156" fill="url(#hero-glow-r-light)"/>

    <!-- Stars / Sky Celestial -->
    <g shape-rendering="crispEdges">
      <rect x="797" y="42" width="6" height="3" fill="#FEF08A"/>
      <rect x="791" y="45" width="3" height="3" fill="#FBBF24"/>
      <rect x="797" y="45" width="6" height="3" fill="#FBBF24"/>
