      <rect x="791" y="51" width="18" height="3" fill="#FBBF24"/>
      <rect x="809" y="51" width="3" height="3" fill="#FEF08A"/>
      <rect x="788" y="54" width="3" height="3" fill="#FEF08A"/>
      <rect x="791" y="54" width="18" height="3" fill="#FBBF24"/>
      <rect x="809" y="54" width="3" height="3" fill="#FEF08A"/>
      <rect x="794" y="57" width="12" height="3" fill="#FEF08A"/>
      <rect x="791" y="60" width="3" height="3" fill="#FBBF24"/>
      <rect x="797" y="60" width="6" height="3" fill="#FBBF24"/>
      <rect x="806" y="60" width="3" height="3" fill="#FBBF24"/>
      <rect x="797" y="63" width="6" height="3" fill="#FEF08A"/>
      <rect x="724" y="48" width="8" height="2" fill="#FFFFFF"/>
      <rect x="720" y="50" width="16" height="2" fill="#FFFFFF"/>
      <rect x="718" y="52" width="20" height="2" fill="#FFFFFF"/>
      <rect x="716" y="54" width="28" height="2" fill="#FFFFFF"/>
      <rect x="718" y="56" width="24" height="2" fill="#94A3B8"/>
    </g>

    <!-- Stepped Pixel Cyber-Citadel Skyline -->
    <g shape-rendering="crispEdges" fill="#DECFA9">
      <rect x="8" y="114" width="824" height="50"/>
      <rect x="18" y="96" width="36" height="18"/><rect x="66" y="82" width="28" height="32"/>
      <rect x="108" y="100" width="44" height="14"/><rect x="530" y="98" width="34" height="16"/>
      <rect x="576" y="80" width="26" height="34"/><rect x="614" y="90" width="42" height="24"/>
      <rect x="668" y="72" width="32" height="42"/><rect x="712" y="94" width="38" height="20"/>
