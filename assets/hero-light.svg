  <rect x="504" y="110" width="150" height="42" rx="3" fill="#EAE0C6" stroke="#8C7A58" stroke-width="1.2"/>
  <rect x="504" y="110" width="150" height="3" rx="1" fill="#6D28D9"/>
  <text x="514" y="126" class="mono" font-size="8.5" font-weight="700" fill="#594D39">RELIABILITY</text>
  <text x="514" y="143" class="mono" font-size="12" font-weight="700" fill="#6D28D9">8 CI · 10 DOCS</text>
  <rect x="664" y="110" width="150" height="42" rx="3" fill="#EAE0C6" stroke="#8C7A58" stroke-width="1.2"/>
  <rect x="664" y="110" width="150" height="3" rx="1" fill="#BE123C"/>
  <text x="674" y="126" class="mono" font-size="8.5" font-weight="700" fill="#594D39">BADGE CASE</text>
  <text x="674" y="143" class="mono" font-size="12" font-weight="700" fill="#BE123C">9 / 12 QUESTS</text>
