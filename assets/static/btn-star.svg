      @keyframes star-shine { 0%, 100% { opacity: 1; } 50% { opacity: 0.72; } }
    </style>
  </defs>
  <rect x="2" y="5" width="152" height="35" rx="4" fill="#1F1403"/>
  <rect x="2" y="2" width="152" height="35" rx="4" fill="#3B2608" stroke="#FBBF24" stroke-width="1.8"/>
  <line x1="6" y1="4" x2="150" y2="4" stroke="#FEF08A" stroke-width="1" opacity="0.6"/>
  <g class="star-glow" shape-rendering="crispEdges">
    <rect x="6" y="6" width="2" height="2" fill="#FEF08A" opacity="0.8"/><rect x="148" y="6" width="2" height="2" fill="#FEF08A" opacity="0.8"/>
    <rect x="19" y="8" width="4" height="4" fill="#FEF08A"/>
    <rect x="17" y="12" width="8" height="3" fill="#FBBF24"/>
    <rect x="11" y="15" width="20" height="4" fill="#FBBF24"/>
    <rect x="14" y="19" width="14" height="3" fill="#F59E0B"/>
    <rect x="14" y="22" width="5" height="4" fill="#FBBF24"/>
    <rect x="23" y="22" width="5" height="4" fill="#FBBF24"/>
    <rect x="20" y="15" width="2" height="2" fill="#FFFFFF"/>
  </g>
  <text x="38" y="18.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="800" fill="#FFFBEB">Star = K.O.!</text>
  <text x="38" y="30.5" font-family="ui-monospace, Consolas, monospace" font-size="9" font-weight="700" fill="#FDE68A">1-Hit Finish</text>
