<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 42" width="188" height="42" role="img" aria-label="Sign Tavern Log (Leave a Guestbook Note)">
  <rect x="2" y="2" width="184" height="38" rx="4" fill="#2A2012" stroke="#FBBF24" stroke-width="2"/>
  <rect x="4" y="34" width="180" height="4" fill="#171108"/>
  <!-- Pixel Scroll -->
  <g shape-rendering="crispEdges">
    <rect x="17" y="10" width="14" height="3" fill="#FBBF24"/>
    <rect x="18" y="13" width="12" height="14" fill="#FEF3C7"/>
    <rect x="20" y="16" width="8" height="2" fill="#92400E"/>
    <rect x="20" y="20" width="8" height="2" fill="#92400E"/>
    <rect x="17" y="27" width="14" height="3" fill="#FBBF24"/>
  </g>
  <text x="44" y="20" font-family="ui-monospace, Consolas, monospace" font-size="12" font-weight="700" fill="#FFFBEB">TAVERN LOG</text>
  <text x="44" y="32" font-family="ui-monospace, Consolas, monospace" font-size="9.5" fill="#FDE68A">LEAVE NOTE · CLICK</text>
</svg>
