name: Refresh Profile Telemetry & Snake

on:
  schedule:
    # Run every 20 minutes at off-peak minutes; commits only when metrics/SVGs change
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-profile]
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "assets/**"
      - "pyproject.toml"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile-output
  cancel-in-progress: false

jobs:
  telemetry:
    name: Compile Pixel Profile, Quest Cartridges & Telemetry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: repo-main

      - name: Checkout output branch (or bootstrap orphan)
        shell: bash
        run: |
          git clone --branch output --single-branch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo-output 2>/dev/null || (
            mkdir -p repo-output
            cd repo-output
            git init -b output
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          )

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: repo-main/pyproject.toml

      - name: Install dependencies and run tests
        working-directory: repo-main
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m ruff check scripts tests
          python -m pytest -v

      - name: Fetch GitHub metrics, apply commit synergy, and render Light/Dark SVGs
        working-directory: repo-main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_READ_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}
        run: |
          mkdir -p ../repo-output/data ../repo-output/assets
          python -m scripts.fetch_github_data \
            --out /tmp/fresh_metrics.json \
            --fallback ../repo-output/data/metrics.json

          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.compute_gamification import evaluate_metrics
          from scripts.game_engine import init_game_state, sync_commit_synergy, sync_external_star_ko

          fresh_path = Path("/tmp/fresh_metrics.json")
          metrics_path = Path("../repo-output/data/metrics.json")
          state_path = Path("../repo-output/data/game_state.json")

          fresh = json.loads(fresh_path.read_text(encoding="utf-8"))

          def _semantic(payload: dict) -> dict:
              return {
                  "user": payload.get("user"),
                  "contributions": payload.get("contributions"),
                  "pull_requests": payload.get("pull_requests"),
                  "owned_repositories": payload.get("owned_repositories"),
                  "sync_date": (payload.get("generated_at_utc") or "")[:10],
              }

          if metrics_path.exists():
              existing = json.loads(metrics_path.read_text(encoding="utf-8"))
              if _semantic(fresh) != _semantic(existing):
                  metrics_path.write_text(json.dumps(fresh, indent=2), encoding="utf-8")
          else:
              metrics_path.write_text(json.dumps(fresh, indent=2), encoding="utf-8")

          raw = json.loads(metrics_path.read_text(encoding="utf-8"))
          report = evaluate_metrics(raw)
          if state_path.exists():
              state = json.loads(state_path.read_text(encoding="utf-8"))
              state = sync_commit_synergy(state, report.total_contributions)
              state = sync_external_star_ko(state, report.external_stars)
          else:
              state = init_game_state(report.total_contributions, report.external_stars)
          state_path.write_text(json.dumps(state, indent=2), encoding="utf-8")
          PY

          python -m scripts.render_svgs \
            --metrics ../repo-output/data/metrics.json \
            --game-state ../repo-output/data/game_state.json \
            --out-dir ../repo-output/assets \
            --report-out /tmp/fresh_gamification.json

          python - <<'PY'
          import json
          from pathlib import Path

          fresh_rep = json.loads(Path("/tmp/fresh_gamification.json").read_text(encoding="utf-8"))
          rep_path = Path("../repo-output/data/gamification.json")
          if not rep_path.exists():
              rep_path.write_text(json.dumps(fresh_rep, indent=2), encoding="utf-8")
          else:
              prev = json.loads(rep_path.read_text(encoding="utf-8"))
              cmp_fresh = {k: v for k, v in fresh_rep.items() if k != "generated_at_utc"}
              cmp_prev = {k: v for k, v in prev.items() if k != "generated_at_utc"}
              if cmp_fresh != cmp_prev or prev.get("generated_at_utc", "")[:10] != fresh_rep.get("generated_at_utc", "")[:10]:
                  rep_path.write_text(json.dumps(fresh_rep, indent=2), encoding="utf-8")
          PY

      - name: Commit and push updated SVGs to output branch
        working-directory: repo-output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch assets/hero-*.svg assets/quest-*.svg assets/armory-*.svg assets/snake-banner-*.svg
          git add data assets
          if git diff --cached --quiet; then
            echo "No profile telemetry or SVG changes detected."
          else
            git commit -m "chore(telemetry): refresh pixel RPG profile assets"
            git push origin output
          fi

  snake:
    name: Generate Contribution Snake SVGs
    needs: telemetry
    runs-on: ubuntu-latest
    steps:
      - name: Generate Light and Dark snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: 25sarvesh2005
          github_token: ${{ secrets.PROFILE_READ_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#1d4ed8
            dist/snake-dark.svg?palette=github-dark&color_snake=#38bdf8

      - name: Push snake SVGs to output branch
        shell: bash
        run: |
          git clone --branch output --single-branch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo-output
          mkdir -p repo-output/assets
          cp dist/snake-light.svg repo-output/assets/snake-light.svg
          cp dist/snake-dark.svg repo-output/assets/snake-dark.svg
          cd repo-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake-light.svg assets/snake-dark.svg
          if git diff --cached --quiet; then
            echo "No snake SVG changes detected."
          else
            git commit -m "chore(snake): refresh contribution snake SVGs"
            git push origin output
          fi
