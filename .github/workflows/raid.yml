name: Interactive Visitor Boss Raid

on:
  issues:
    types: [opened]
  watch:
    types: [started]

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-profile-output
  cancel-in-progress: false

jobs:
  raid_move:
    name: Process Visitor Raid Action or Star KO
    if: (github.event_name == 'issues' && startsWith(github.event.issue.title, 'raid|')) || github.event_name == 'watch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: repo-main

      - name: Checkout output branch (or bootstrap orphan)
        shell: bash
        run: |
          git clone --branch output --single-branch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo-output 2>/dev/null || (
            mkdir -p repo-output
            cd repo-output
            git init -b output
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          )

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: repo-main/pyproject.toml

      - name: Install dependencies
        working-directory: repo-main
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Ensure baseline metrics exist
        working-directory: repo-main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ../repo-output/data ../repo-output/assets
          if [ ! -f ../repo-output/data/metrics.json ]; then
            python -m scripts.fetch_github_data --out ../repo-output/data/metrics.json
          fi

      - name: Execute Star 1-Hit KO or Issue Raid Move & Re-render SVGs
        working-directory: repo-main
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_STAR_USER: ${{ github.event_name == 'watch' && github.event.sender.login || '' }}
          EVENT_ISSUE_TITLE: ${{ github.event.issue.title }}
          EVENT_ISSUE_BODY: ${{ github.event.issue.body }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_USER_LOGIN: ${{ github.event.issue.user.login }}
        run: |
          set +e
          if [ "$EVENT_NAME" = "watch" ]; then
            python -m scripts.game_engine --state ../repo-output/data/game_state.json
          else
            python -m scripts.game_engine \
              --state ../repo-output/data/game_state.json \
              --reply-out ../reply.md
          fi
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "RAID_INVALID=true" >> "$GITHUB_ENV"
            exit 0
          fi
          python -m scripts.render_svgs \
            --metrics ../repo-output/data/metrics.json \
            --game-state ../repo-output/data/game_state.json \
            --out-dir ../repo-output/assets

      - name: Push updated Battle Arena SVGs to output branch
        if: env.RAID_INVALID != 'true'
        working-directory: repo-output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          if ! git diff --cached --quiet; then
            if [ "${{ github.event_name }}" = "watch" ]; then
              git commit -m "chore(raid): star 1-hit KO by @${{ github.event.sender.login }}"
            else
              git commit -m "chore(raid): visitor move #${{ github.event.issue.number }}"
            fi
            git push origin output
          fi

      - name: Post RPG combat log comment & close issue
        if: github.event_name == 'issues'
        working-directory: repo-main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python -m scripts.gh_issue_reply --reply-file ../reply.md
